name: 🦊 OrangeFox for marble - 构建

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox 清单分支'
        required: true
        default: '12.1'
        type: choice
        options:
          - 14.1
          - 12.1
      DEVICE_TREE:
        description: 'OrangeFox 设备树'
        required: true
        default: 'https://github.com/AviderMin/android_device_xiaomi_marble-OFRP'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox 设备树分支'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: '输入你的设备路径'
        required: true
        default: 'device/xiaomi/marble'
      DEVICE_NAME:
        description: '输入你的设备代号'
        required: true
        default: 'marble'
      BUILD_TARGET:
        description: '选择你的构建目标'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      OF_MAINTAINER:
        description: '输入维护者名称'
        required: true
        default: 'AviderMin'

jobs:
  build:
    name: 🏗️ 构建 OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USE_CCACHE: 1
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: 🛒 检出代码
        uses: actions/checkout@v4

      - name: 🧹 清理空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 💾 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: 🛠️ 构建环境
        run: |
          sudo apt install aria2 -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: 💾 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_TREE_BRANCH }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-
            ccache-${{ runner.os }}-${{ inputs.DEVICE_NAME }}-
            ccache-${{ runner.os }}-

      - name: ⚡ 初始化 ccache
        run: |
          ccache --zero-stats || true
          ccache -M 50G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -s

      - name: 📜 建立清单
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh \
            --branch ${{ inputs.MANIFEST_BRANCH }} \
            --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

      - name: 📥 克隆设备树
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
          cd ${{ inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 🛠️ 替换 addons 文件
        run: |
          git clone https://github.com/AviderMin/OrangeFox_Addons.git ${GITHUB_WORKSPACE}/addons
          cp ${GITHUB_WORKSPACE}/addons/* \
             ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/Files/ || true

      - name: 🔨 构建 OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          set +e

          export OF_MAINTAINER=${{ inputs.OF_MAINTAINER }}
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
          export LC_ALL=C

          source build/envsetup.sh

          set -e
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image

      - name: 📊 显示 ccache 统计
        run: |
          ccache -sv

      - name: 🏷️ 设置发布属性
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

      - name: 📦 处理输出文件
        run: |
          OUT_DIR=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/target/product/${{ inputs.DEVICE_NAME }}

          for f in "$OUT_DIR"/OrangeFox*.img "$OUT_DIR"/OrangeFox*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            mv "$f" "$OUT_DIR/${name}-${BUILD_DATE}.${ext}"
          done

      - name: 🚀 上传至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          files: |
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          body: |
            ## OrangeFox Recovery Build - Unofficial

            Build Branch: fox_${{ inputs.MANIFEST_BRANCH }}
            Device Tree: ${{ inputs.DEVICE_TREE }}
            Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Commit: ${{ env.COMMIT_ID }}
            Maintainer: ${{ inputs.OF_MAINTAINER }}
